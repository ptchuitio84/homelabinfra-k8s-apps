# ── Keycloak ──────────────────────────────────────────────────────────────────
keycloakx:

  # ── Startup
  # start-dev: HTTP enabled, no TLS cert required, embedded H2 replaced by
  # postgres via KC_DB env vars below. Hostname set explicitly so the OIDC
  # issuer URL is stable (http://keycloak.nnt.com/realms/<realm>).
  args:
    - "start-dev"
    - "--hostname=keycloak.nnt.com"
    - "--hostname-admin=keycloak.nnt.com"

  # ── Admin credentials
  # K8s Secret created by Ansible from Vault before this chart is deployed:
  #   ansible-playbook playbooks/linux/setup_keycloak_sso.yml --tags=pre
  # Secret keys: KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD
  extraEnvFrom: |
    - secretRef:
        name: keycloak-admin-secret

  # ── Database — external Postgres StatefulSet in templates/postgres.yaml
  extraEnv: |
    - name: KC_DB
      value: postgres
    - name: KC_DB_URL_HOST
      value: keycloak-postgresql
    - name: KC_DB_URL_PORT
      value: "5432"
    - name: KC_DB_URL_DATABASE
      value: keycloak
    - name: KC_DB_USERNAME
      value: keycloak
    - name: KC_DB_PASSWORD
      value: keycloak

  # ── Ingress via Traefik
  ingress:
    enabled: true
    ingressClassName: traefik
    rules:
      - host: keycloak.nnt.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # ── Resources
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # ── Replicas
  replicas: 1
