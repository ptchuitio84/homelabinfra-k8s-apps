# ── Bitnami PostgreSQL ────────────────────────────────────────────────────────
# Separate subchart — SonarSource dropped the embedded postgres in 2025+ charts.
# Bitnami stopped publishing to Docker Hub in Oct 2024; override registry to ghcr.io.
postgresql:
  enabled: true
  image:
    registry: ghcr.io
  auth:
    database: sonarqube
    username: sonarqube
    password: sonarqube
  primary:
    persistence:
      enabled: true
      storageClass: "nfs"
      size: 20Gi

# ── SonarQube ─────────────────────────────────────────────────────────────────
sonarqube:

  # ── Ingress
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - name: sonarqube.nnt.com
        path: /
    annotations: {}

  # ── External DB — bitnami postgresql from this umbrella chart
  # Service name: sonarqube-postgresql (Helm release sonarqube + subchart postgresql)
  jdbcOverwrite:
    enabled: true
    jdbcUrl: "jdbc:postgresql://sonarqube-postgresql:5432/sonarqube"
    jdbcUsername: "sonarqube"
    jdbcPassword: "sonarqube"

  # ── Persistence — NFS storageClass survives pod rescheduling
  persistence:
    enabled: true
    storageClass: "nfs"
    size: 20Gi

  # ── Resources
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "400m"
      memory: "1Gi"

  # ── JVM
  jvmOpts: "-Xms512m -Xmx1024m"

  # ── Edition — community.enabled replaces the old "edition: community" field in 2026.x
  community:
    enabled: true

  # ── Monitoring — required by chart validation; used by readiness/liveness probes
  monitoringPasscode: "nnt-sonarqube-monitor"
